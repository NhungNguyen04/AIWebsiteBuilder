version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: websitebuilder-db
    environment:
      POSTGRES_USER: ${DB_USER:-websitebuilder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-websitebuilder}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-websitebuilder}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - websitebuilder-network

  redis:
    image: redis:7-alpine
    container_name: websitebuilder-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - websitebuilder-network

  app:
    image: websitebuilder
    build:
      context: .
      dockerfile: Dockerfile
    container_name: websitebuilder-app
    command: npm start
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://websitebuilder:changeme@postgres:5432/websitebuilder}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - websitebuilder-network
    restart: unless-stopped

  worker:
    image: websitebuilder
    container_name: websitebuilder-worker
    command: npm run worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://websitebuilder:changeme@postgres:5432/websitebuilder}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      E2B_API_KEY: ${E2B_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - websitebuilder-network
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: websitebuilder-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - websitebuilder-network

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  websitebuilder-network:
    driver: bridge